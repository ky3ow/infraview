name: Test

on:
  push:
    branches:
      - feature/prepare_bachelors
  pull_request:
    branches:
      - feature/prepare_bachelors

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: |
          go test ./pkg/{catalog,storage} -cover
          go test ./test/graph/ -cover -coverpkg=./pkg/graph
