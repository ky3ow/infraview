{{define "content"}}
<div class="catalog-page">
  <h1>Catalog</h1>

  <form class="catalog-search" hx-get="/" hx-target="#catalog-namespaces" hx-trigger="input changed delay:300ms, search">
    <input type="search" name="q" value="{{.Query}}" placeholder="Search namespaces and revisions" aria-label="Search namespaces and revisions">
  </form>

  <div id="catalog-namespaces" class="catalog-namespaces">
      {{template "catalog-namespaces" .}}
  </div>
</div>
{{end}}

{{define "scripts"}}
<script type="module" src="/static/catalog.js"></script>
{{end}}
