{{define "head"}}
<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/slim-select@latest/dist/slimselect.js"></script>
<link href="https://unpkg.com/slim-select@latest/dist/slimselect.css" rel="stylesheet"></link>
<!-- TODO should experiment with ELK algorithm IF ADJUSTING SPACING WORKS -->
<!-- <script src="https://cdn.jsdelivr.net/npm/elkjs@0.11.1/lib/elk.bundled.min.js"></script> -->
<!-- <script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/dist/cytoscape-elk.min.js"></script> -->
{{end}}

{{define "header-extra"}}
<div class="graph-selector-bar">
  <div class="selector-field">
    <label for="namespaces-dropdown">NS</label>
    <select id="namespaces-dropdown">
      {{$ns := .SelectedNamespace}}
      {{range .Namespaces}}<option value="{{.Name}}" {{if eq .Name $ns}}selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </div>

  <div class="selector-field">
    <label for="revisions-dropdown">@</label>
    <select id="revisions-dropdown">
      {{template "revision-options" .}}
    </select>
    <span id="revision-indicator" class="htmx-indicator">…</span>
  </div>
</div>
{{end}}

{{define "revision-options"}}
{{$rev := .SelectedRevision}}
<option data-placeholder="true" value="">choose a revision...</option>
{{range .Revisions}}
<option value="{{.Hash}}" {{if eq .Hash $rev}}selected{{end}}>{{if .Name}}{{.Name}} ({{.Hash}}){{else}}{{.Hash}}{{end}}</option>
{{end}}
{{end}}

{{define "content"}}
<div id="graph-content" class="graph-layout">
  <aside class="sidebar">
    <div class="sidebar-content">
      <div id="state-filters">
        <div class="state-filter-list">
        {{range $name, $state := .Filters}}
          <label class="state-filter-item">
            <span class="state-filter-color-dot" data-filter-state="{{$name}}"></span>
            <span class="state-filter-label">{{$state.Label}}</span>
            <span class="state-filter-count">{{$state.Count}}</span>
            <input type="checkbox" id="state-filter-checkbox-{{$name}}" class="state-filter-checkbox" data-filter-state="{{$name}}" checked disabled />
          </label>
        {{end}}
        <button class="state-filter-reset-btn">Show All</button>
        </div>
      </div>
    </div>
  </aside>
  <div class="graph-container">
    <div id="graph"></div>
    <div id="node-details-sidebar"></div>
  </div>
  <script id="graph-data" type="application/json">{{.Graph}}</script>
</div>
{{end}}

{{define "scripts"}}
<script type="module" src="https://unpkg.com/lighterhtml?module"></script>
<script type="module" src="/static/main.js"></script>
<script type="module" src="/static/icons_default.js"></script>
<script src="/static/graph_select.js"></script>
{{end}}
