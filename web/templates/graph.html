{{define "head"}}
<script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
<!-- TODO should experiment with ELK algorithm IF ADJUSTING SPACING WORKS -->
<!-- <script src="https://cdn.jsdelivr.net/npm/elkjs@0.11.1/lib/elk.bundled.min.js"></script> -->
<!-- <script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/dist/cytoscape-elk.min.js"></script> -->
<script id="initial-graph" type="application/json">{{.Graph}}</script>
{{end}}

{{define "header-extra"}}
<form class="graph-selector-bar" action="/graph" method="get">
  <div class="selector-field">
    <label for="namespace-input">Namespace</label>
    <input id="namespace-input" name="namespace" list="namespace-list"
      placeholder="Type to filter…" value="{{.SelectedNamespace}}"
      hx-get="/graph/revisions"
      hx-target="#revision-list"
      hx-trigger="input changed delay:150ms"
      hx-indicator="#revision-indicator"
      autocomplete="off"
      required>
    <datalist id="namespace-list">
      {{range .Namespaces}}<option value="{{.Name}}">{{end}}
    </datalist>
  </div>

  <div class="selector-field">
    <label for="revision-input">Revision</label>
    <input id="revision-input" name="revision" list="revision-list"
      placeholder="Select namespace first…" value="{{.SelectedRevision}}"
      autocomplete="off"
      required>
    <datalist id="revision-list">
      {{template "revision-options" .}}
    </datalist>
    <span id="revision-indicator" class="htmx-indicator">…</span>
  </div>
</form>
{{end}}

{{define "revision-options"}}
{{range .Revisions}}
<option value="{{.Hash}}">{{if .Name}}{{.Name}} ({{.Hash}}){{else}}{{.Hash}}{{end}}</option>
{{end}}
{{end}}

{{define "content"}}
<div class="graph-layout">
  <aside class="sidebar">
    <div class="sidebar-content">
      <div id="state-filters"></div>
    </div>
  </aside>
  <div class="graph-container">
    <div id="graph"></div>
    <div id="node-details-sidebar"></div>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script type="module" src="https://unpkg.com/lighterhtml?module"></script>
<script type="module" src="/static/main.js"></script>
<script type="module" src="/static/icons_default.js"></script>
{{end}}
