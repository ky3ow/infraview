{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infraview - Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f6;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border: 1px solid #dcdfe3;
      border-radius: 8px;
      padding: 2rem;
      width: 340px;
    }
    .login-card h1 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #1a1a1a;
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      color: #667085;
      margin-bottom: 0.4rem;
    }
    .login-card input[type="text"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 4px;
      color: #333;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .login-card input[type="text"]:focus {
      outline: none;
      border-color: #5560f0;
      box-shadow: 0 0 0 2px rgba(85, 96, 240, 0.15);
    }
    .login-card button {
      width: 100%;
      padding: 0.6rem;
      background: #5560f0;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    .login-card button:hover { background: #4348d4; }
    .error {
      color: #b42318;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Infraview</h1>
    {{if .}}<div class="error">{{.}}</div>{{end}}
    <form method="POST" action="/login">
      <label for="token">Token</label>
      <input type="text" id="token" name="token" placeholder="paste your token" required autocomplete="off">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
{{end}}
