{{define "catalog-namespace"}}
<section class="catalog-namespace">
  <header class="namespace-header">
    <h2>{{.Name}}</h2>
  </header>
  {{$namespace := .Name}}
  <ul class="revision-list">
    {{range .Revisions}}
    <li class="revision-item">
      <a class="revision-link" href="/graph/{{$namespace}}/{{.Hash}}">
        <div class="revision-main">
          <div class="revision-identity">
            <code>{{.Hash}}</code>
            {{if .Name}}<span class="revision-branch">{{.Name}}</span>{{end}}
          </div>
        </div>
        <div class="revision-changes" aria-label="Change overview">
          <span class="revision-change-created" title="Created">+{{.Summary.Created}}</span>
          <span class="revision-change-updated" title="Updated">~{{.Summary.Updated}}</span>
          <span class="revision-change-deleted" title="Deleted">-{{.Summary.Deleted}}</span>
        </div>
      </a>
    </li>
    {{end}}
  </ul>
</section>
{{end}}
