{{define "header"}}
<header class="header">
  <div class="header-brand">Infraview</div>
  {{block "header-extra" .}}{{end}}
  <nav class="header-nav">
    <a href="/" class="header-nav-link{{if eq .ActivePage "catalog"}} active{{end}}">Catalog</a>
    <a href="/graph" class="header-nav-link{{if eq .ActivePage "graph"}} active{{end}}">Graph</a>
    <div class="header-nav-divider"></div>
    <form method="POST" action="/logout">
      <button type="submit" class="logout-btn">Logout</button>
    </form>
  </nav>
</header>
{{end}}
