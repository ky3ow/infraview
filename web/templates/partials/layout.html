{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
  {{block "head" .}}{{end}}
</head>
<body>
  {{template "header" .}}
  <div class="app-layout">
    <main class="main-content">
      {{block "content" .}}{{end}}
    </main>
  </div>
  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
